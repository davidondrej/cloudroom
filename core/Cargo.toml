[package]
name = "cloudroom"
version = "0.1.110"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# History, diagnostics, and feedback go to the website over HTTPS (ADR 0232); history files are gzip (ADR 0237).
# system-proxy: the Mac helper follows the macOS proxy setting, as client.py does (#109). Linux reads only env vars.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy"] }
# Already built through rustls; the Mac helper uses its SHA-256 for its LaunchAgent label.
ring = "0.17"
flate2 = "1"
tokio-stream = "0.1"
# Already built through axum; named here for preview tunnels (HTTP upgrades).
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
