name: Core

on:
  push:
    branches: [main]
    paths: ['core/**', '.github/workflows/core.yml']
  pull_request:
    paths: ['core/**', '.github/workflows/core.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Rust checks
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked
      - name: Disposable disk-safety and attachment checks
        run: |
          docker pull postgres:16-alpine
          sudo useradd --system --user-group --no-create-home cr-service-test
          sudo useradd --system --user-group --no-create-home cr-disk-test
          sudo python3 tests/storage_e2e.py --disposable --mixed
      - name: Client and fixture checks
        run: |
          python3 tests/preview_client.py
          node --test integrations/bb/client.test.ts
          python3 tests/install.py
          python3 tests/core_fixture.py
          python3 tests/pi_http.py
          python3 tests/workspaces.py
          python3 tests/sync_e2e.py
      - name: Disposable SSH preview checks
        run: sudo python3 tests/previews_ssh.py --disposable
      - name: Disposable PostgreSQL checks
        run: |
          python3 tests/core_e2e.py --foundation
          python3 tests/core_e2e.py --fixture
