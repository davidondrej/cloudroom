name: App

on:
  push:
    branches: [main]
    paths: ['gui/**', 'skills/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['gui/**', 'skills/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: gui/.nvmrc
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: gui/package.json
          cache: true
          cache_dependency_path: gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck --filter=@cloudroom/app --filter=@cloudroom/server --filter=@cloudroom/desktop --concurrency=2
      - name: Tests
        run: pnpm exec turbo run test --filter=@cloudroom/config --concurrency=2
